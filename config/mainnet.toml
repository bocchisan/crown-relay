# crown-relay — mainnet-профиль. На mainnet override init запрещён (trap).

index_principal  = "PLACEHOLDER_indexer_mainnet_principal"
cycle_floor      = 1_000_000_000_000
ingest_price     = 17_000_000_000        # ≥ индексного
sign_price       = 35_800_000_000        # ≥ игрового
root_price       = 1_400_000_000         # ≥ игрового ROOT_PRICE (аутентификация корня индекса)
# Per-key cap (инв. #6) — в ЦИКЛАХ, не в вызовах. Счёт вызовов ограничивал темп,
# но не сумму: единственным настоящим стопом был `cycle_floor`, то есть весь
# баланс, и медленная утечка просто выедала его дольше. Плюс он оценивал `Sign`
# так же, как впись, хотя тот дороже в 2.6 раза. Три цены, а не две: релей фронтит
# ровно три вызова — `index.ingest`, игровой `request_signature` и игровой
# `push_root` (`GameCall`), — и цену каждого выбирает он, а не вызывающий.
#
# Дневной бюджет — это и есть потолок ущерба от утёкшего ключа. 100e12 ≈ $136.6/сут
# на ключ. Прежние 100 вызовов/мин давали $7 044/сут — в 51 раз больше и без
# всякого суточного потолка. Релеер не заморожен: растёт объём — поднимаем здесь,
# это управляемый параметр, а не константа заморозки.
#
# **Сколько это в расчётах — считать по всем трём вызовам, а не по вписям.**
# Прежняя редакция этого комментария заявляла «покрывает 2 000 сеттлментов/сут с
# запасом 1.8×», подставив только вписи (4 000 × ingest). Но из этого же бюджета
# уходят подпись и пуш корня, а подпись — самый дорогой вызов из трёх. На
# сценарии `cost.md §7` (2 000 расчётов/сут, структура задания):
#   4 000 × 17e9 (вписи) + 2 000 × 35.8e9 (подписи) + 2 000 × 1.4e9 (корни) = 142.4e12
# то есть один ключ покрывает ~1 400 расчётов/сут, а не 2 000 с запасом. Это не
# ошибка бюджета, а ошибка прежнего счёта: масштабируется он ключами (их число не
# ограничено) либо подъёмом этого числа — но второе поднимает и потолок ущерба.
burst_budget_cycles = 500_000_000_000      # ≈$0.68/мин на ключ — гасит всплеск
burst_window_secs   = 60
daily_budget_cycles = 100_000_000_000_000  # ≈$136.6/сут на ключ — потолок ущерба
daily_window_secs   = 86_400

allowlist = ["PLACEHOLDER_pusher_principal"]

# Игровые канистры — единственные допустимые цели `Sign` (защита бюджета от увода
# на канистру атакующего). На mainnet override запрещён, так что здесь — финальный
# список; плейсхолдер до P8 (пустой рантайм-набор = все `Sign` отклоняются).
games = ["PLACEHOLDER_game_mainnet_principal"]
