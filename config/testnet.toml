# crown-relay — devnet-профиль. Управляется (не заморожен).

index_principal  = "aaaaa-aa"                               # principal crown-indexer (плейсхолдер; реальный — через init/P8)
cycle_floor      = 1_000_000_000_000     # пол бюджета до форварда
ingest_price     = 17_000_000_000        # ≥ индексного INGEST_PRICE
sign_price       = 26_200_000_000        # ≥ игрового SIGN_PRICE (≈$0.036)
root_price       = 1_000_000_000         # ≥ игрового ROOT_PRICE (аутентификация корня индекса)

# Per-key cap (инв. #6) — в циклах, не в вызовах; обоснование — mainnet-профиль.
# На devnet бюджеты вдесятеро меньше: настоящей нагрузки нет, а утёкший тестовый
# ключ должен упираться в потолок быстро и заметно.
burst_budget_cycles = 100_000_000_000      # ≈$0.14/мин на ключ
burst_window_secs   = 60
daily_budget_cycles = 10_000_000_000_000   # ≈$13.7/сут на ключ
daily_window_secs   = 86_400

# Allowlist — пушеры платформы (per-key rate-limit против утёкшего ключа).
allowlist = ["eplld-sl4xf-ez7zc-nvvcs-6wm66-ie2hx-ojwvh-7dr75-pwewa-icrm7-iae"]

# Игровые канистры — единственные допустимые цели `Sign`. Без этого allowlist
# утёкший ключ увёл бы прикреплённые циклы на канистру атакующего. Реальные
# principal'ы игр подаются через `init` на devnet (плейсхолдер по умолчанию).
games = ["PLACEHOLDER_game_devnet_principal"]
